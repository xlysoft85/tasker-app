name: Tasker
description: Build the Tasker dashboard (index.html) and TASKER.md from a repository of plain-text items.
branding:
  icon: check-square
  color: blue
inputs:
  repo:
    description: Folder of the data repo (holds projects.yaml).
    default: "."
  site:
    description: Folder to write index.html into.
    default: _site
  push:
    description: Commit and push TASKER.md when an item changed ("true" or "false").
    default: "true"
  timezone:
    description: Time zone that decides which check dates are due today.
    default: UTC
  today:
    description: Override today's date (YYYY-MM-DD). For demos and tests.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet pyyaml
    - shell: bash
      env:
        TZ: ${{ inputs.timezone }}
        REPO: ${{ inputs.repo }}
        SITE: ${{ inputs.site }}
        PUSH: ${{ inputs.push }}
        TODAY: ${{ inputs.today }}
      run: |
        cd "$REPO"
        git config user.name >/dev/null || git config user.name "github-actions[bot]"
        git config user.email >/dev/null || git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        args=(--repo . --site "$GITHUB_WORKSPACE/$SITE")
        if [ "$PUSH" = true ]; then args+=(--no-pull); else args+=(--no-git); fi
        if [ -n "$TODAY" ]; then args+=(--today "$TODAY"); fi
        python "$GITHUB_ACTION_PATH/tasker.py" "${args[@]}"
