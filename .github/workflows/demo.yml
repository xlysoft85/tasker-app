# Publish the example/ data as the live demo on this repo's GitHub Pages.
name: Demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: demo/history.sh _demo 2026-11-02   # example/ plus a week of finished items
      - uses: ./
        with:
          repo: _demo
          push: "false"
          today: "2026-11-02"   # the example dates are written around this day
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
