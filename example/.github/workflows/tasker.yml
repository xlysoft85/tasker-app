# Rebuild the dashboard on every push that changes a file Tasker reads, and once a day so check
# dates come due. If tasker.yaml renames the focus or routines file, rename it here too.
name: Tasker
on:
  push:
    branches: [main]
    paths: [projects/**, projects.yaml, tasker.yaml, FOCUS.md, routines.yaml]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit TASKER.md
  pages: write
  id-token: write

concurrency:
  group: tasker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: "updated" dates and "done in the last 7 days"
      - uses: xlysoft85/tasker-app@v1
        with:
          timezone: Europe/London   # decides when a check date is "today"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A job of its own: deploy-pages run right after the upload in the same job sometimes
  # finds no artifact yet ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
